<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>howegothere</title>
  <style>
    :root { --bg: #f7f2ea; --fg: #2b2620; --muted: #8a7f72; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1a17; --fg: #f1ebe2; --muted: #9b9184; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px; text-align: center;
    }
    h1 { font-size: clamp(2rem, 7vw, 4rem); font-weight: 600; letter-spacing: -0.02em; }
    .dim { color: var(--muted); }
    p { margin-top: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>h<span class="dim">o</span>w<span class="dim">e</span>go<em>t</em>here</h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
